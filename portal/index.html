<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Premium · El Método Nari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void:#FAF6F2; --void-mid:#FCE7DD; --void-lift:#FFFFFF;
      --text:#1F2E46; --text-dim:rgba(31,46,70,.7); --text-ghost:rgba(31,46,70,.4);
      --coral:#F4A88A; --coral-ink:#D96B47; --teal:#8599AD; --teal-ink:#5E7488;
      --navy:#1F2E46; --gold:#B08D57; --gold-soft:rgba(176,141,87,.12); --line:rgba(31,46,70,.08);
      --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
      --ease:cubic-bezier(0.16,1,0.3,1);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--sans); background:var(--void); color:var(--text); display:flex; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }
    ::selection { background:rgba(244,168,138,.3); }
    a { color:inherit; }

    /* SIDEBAR */
    .sidebar { width:360px; background:var(--void-lift); border-right:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0; z-index:40; box-shadow:4px 0 30px rgba(31,46,70,.03); }
    .brand-header { padding:26px 28px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    .brand-header img { height:24px; filter:brightness(.62) saturate(1.4) hue-rotate(-5deg); }
    .portal-tag { font-family:var(--mono); font-size:.56rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); padding:4px 9px; border-radius:5px; background:var(--gold-soft); border:1px solid rgba(176,141,87,.22); margin-left:auto; }

    .course-card { margin:22px 20px 6px; padding:20px; border-radius:16px; background:linear-gradient(160deg,#FFFFFF,#FFFBF8); border:1px solid var(--line); box-shadow:0 4px 18px rgba(31,46,70,.04); display:flex; gap:16px; align-items:center; }
    .ring-wrap { position:relative; width:58px; height:58px; flex-shrink:0; }
    .ring-wrap svg { transform:rotate(-90deg); width:58px; height:58px; }
    .ring-bg { fill:none; stroke:rgba(31,46,70,.08); stroke-width:5; }
    .ring-fg { fill:none; stroke:var(--coral-ink); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 1s var(--ease); }
    .ring-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:.72rem; font-weight:600; color:var(--navy); }
    .course-meta { display:flex; flex-direction:column; gap:3px; min-width:0; }
    .course-name { font-family:var(--serif); font-size:1.18rem; font-weight:600; color:var(--navy); line-height:1.1; }
    .course-sub { font-size:.72rem; color:var(--text-ghost); }
    .course-sub b { color:var(--coral-ink); font-weight:600; }

    .module-list { flex:1; overflow-y:auto; padding:18px 14px 14px; display:flex; flex-direction:column; gap:4px; }
    .module-list::-webkit-scrollbar { width:4px; }
    .module-list::-webkit-scrollbar-thumb { background:rgba(31,46,70,.12); border-radius:4px; }
    .mod-group { margin-bottom:14px; }
    .mod-chapter { display:flex; align-items:center; gap:9px; padding:0 14px; margin-bottom:10px; }
    .mod-chapter .ch-n { font-family:var(--mono); font-size:.62rem; font-weight:600; color:var(--teal-ink); }
    .mod-chapter .ch-name { font-size:.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--teal-ink); }
    .mod-chapter .ch-lock { margin-left:auto; color:var(--text-ghost); display:flex; }

    .mod-item { display:flex; align-items:center; gap:13px; padding:12px 14px; border-radius:12px; text-decoration:none; color:var(--text-dim); transition:background .25s var(--ease),color .25s,transform .25s var(--ease); border:1px solid transparent; cursor:pointer; position:relative; }
    .mod-item:hover:not(.locked) { background:rgba(31,46,70,.025); color:var(--navy); }
    .mod-item.active { background:var(--navy); color:var(--void); border-color:var(--navy); box-shadow:0 14px 34px rgba(31,46,70,.16); transform:translateX(3px); }
    .mod-item.locked { opacity:.55; cursor:not-allowed; }
    .mod-status { width:26px; height:26px; flex-shrink:0; border-radius:50%; border:1.5px solid rgba(31,46,70,.18); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:.66rem; font-weight:600; color:var(--text-ghost); transition:all .3s var(--ease); }
    .mod-item.active .mod-status { border-color:rgba(250,246,242,.4); color:var(--coral); }
    .mod-status.done { background:var(--coral-ink); border-color:var(--coral-ink); color:#fff; }
    .mod-item.active .mod-status.done { background:var(--coral); border-color:var(--coral); color:var(--navy); }
    .mod-status svg { width:13px; height:13px; }
    .mod-status .check { animation:pop .4s var(--ease); }
    @keyframes pop { 0%{transform:scale(0);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
    .mod-body { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
    .mod-title { font-size:.87rem; font-weight:500; line-height:1.25; }
    .mod-dur { font-family:var(--mono); font-size:.6rem; letter-spacing:.04em; color:var(--text-ghost); }
    .mod-item.active .mod-dur { color:rgba(250,246,242,.5); }

    .chapter-soon { margin:2px 14px 0; padding:12px 14px; border-radius:12px; background:var(--void); border:1px dashed var(--line); font-size:.72rem; color:var(--text-ghost); line-height:1.5; }
    .chapter-soon b { color:var(--gold); font-weight:600; }

    .user-profile { padding:16px 20px 18px; border-top:1px solid var(--line); background:rgba(244,168,138,.04); display:flex; flex-direction:column; gap:12px; }
    .user-profile-row { display:flex; align-items:center; gap:13px; }
    .user-avatar { width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; box-shadow:0 4px 12px rgba(244,168,138,.25); background:linear-gradient(135deg,var(--coral),var(--teal)); }
    .user-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .user-meta { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
    .user-name { font-size:.9rem; font-weight:600; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-since { font-family:var(--serif); font-size:.74rem; font-style:italic; color:var(--text-ghost); }
    .user-foot { display:flex; align-items:center; justify-content:space-between; }
    .user-badge { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; background:var(--gold-soft); border-radius:7px; border:1px solid rgba(176,141,87,.22); }
    .user-badge svg { width:11px; height:11px; color:var(--gold); }
    .user-badge-label { font-family:var(--mono); font-size:.58rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
    .user-logout { font-size:.72rem; color:var(--text-ghost); text-decoration:none; transition:color .2s; }
    .user-logout:hover { color:var(--coral-ink); }

    /* CLASSROOM */
    .classroom { flex:1; display:flex; flex-direction:column; position:relative; min-width:0; }
    .lesson-topbar { position:relative; z-index:30; flex-shrink:0; background:rgba(250,246,242,.82); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--line); padding:14px 40px; display:flex; align-items:center; gap:16px; }
    .tb-crumb { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
    .tb-chapter { font-family:var(--mono); font-size:.6rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--teal-ink); }
    .tb-title { font-family:var(--serif); font-size:1.05rem; font-weight:600; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tb-count { font-family:var(--mono); font-size:.64rem; color:var(--text-ghost); white-space:nowrap; }
    .tb-read { position:absolute; left:0; bottom:-1px; height:2px; width:0; background:linear-gradient(90deg,var(--coral-ink),var(--teal)); transition:width .1s linear; }
    .menu-btn { display:none; }

    .lang-toggle { display:inline-flex; position:relative; background:var(--void); border:1px solid var(--line); border-radius:999px; padding:3px; flex-shrink:0; }
    .lang-toggle button { font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.1em; border:none; background:transparent; color:var(--text-ghost); padding:5px 12px; border-radius:999px; cursor:pointer; position:relative; z-index:2; transition:color .25s; }
    .lang-toggle button.active { color:var(--void); }
    .lang-toggle .pill { position:absolute; top:3px; left:3px; bottom:3px; width:calc(50% - 3px); background:var(--navy); border-radius:999px; z-index:1; transition:transform .3s var(--ease); }
    .lang-toggle.en .pill { transform:translateX(100%); }

    .scroll-area { flex:1; overflow-y:auto; scroll-behavior:smooth; position:relative; }
    .scroll-area::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:100%; height:560px; background:radial-gradient(ellipse at top,rgba(244,168,138,.13) 0%,transparent 70%); pointer-events:none; z-index:0; animation:breathGlow 9s ease-in-out infinite; }
    @keyframes breathGlow { 0%,100%{opacity:.55;transform:translateX(-50%) scale(1);} 50%{opacity:1;transform:translateX(-50%) scale(1.1);} }

    .lesson-container { max-width:880px; margin:0 auto; padding:56px 48px 100px; position:relative; z-index:1; }
    .lesson-container > * { animation:rise .65s var(--ease) backwards; }
    .lesson-container > *:nth-child(1){animation-delay:.02s;} .lesson-container > *:nth-child(2){animation-delay:.08s;}
    .lesson-container > *:nth-child(3){animation-delay:.14s;} .lesson-container > *:nth-child(4){animation-delay:.20s;}
    .lesson-container > *:nth-child(5){animation-delay:.26s;} .lesson-container > *:nth-child(6){animation-delay:.32s;}
    .lesson-container > *:nth-child(n+7){animation-delay:.38s;}
    @keyframes rise { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:none;} }

    .lesson-eyebrow { display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--teal-ink); margin-bottom:18px; }
    .lesson-eyebrow .dot { width:3px; height:3px; border-radius:50%; background:var(--text-ghost); }
    .lesson-title { font-family:var(--serif); font-size:clamp(2.6rem,4.5vw,3.8rem); font-weight:300; line-height:1.05; color:var(--navy); margin-bottom:30px; letter-spacing:-.01em; }
    .lesson-title em { font-style:italic; color:var(--coral-ink); font-weight:400; }

    .video-shell { width:100%; aspect-ratio:16/9; background:var(--navy); border-radius:22px; overflow:hidden; position:relative; box-shadow:0 34px 70px rgba(31,46,70,.14); margin-bottom:36px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background-size:cover; background-position:center; cursor:pointer; }
    .video-shell::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(31,46,70,.25),rgba(31,46,70,.55)); transition:background .4s; }
    .video-shell:hover::before { background:linear-gradient(180deg,rgba(31,46,70,.2),rgba(31,46,70,.45)); }
    .play-video-btn { width:76px; height:76px; background:var(--coral); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:transform .3s var(--ease); box-shadow:0 14px 36px rgba(244,168,138,.4); position:relative; z-index:1; }
    .video-shell:hover .play-video-btn { transform:scale(1.08); }
    .play-video-btn svg { width:26px; height:26px; fill:var(--navy); margin-left:4px; }
    .video-label { position:absolute; bottom:22px; left:24px; z-index:1; color:var(--void); }
    .video-label .vl-k { font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(250,246,242,.7); }
    .video-label .vl-t { font-family:var(--serif); font-size:1.2rem; font-weight:500; }

    .audio-player { display:flex; align-items:center; gap:18px; background:var(--void-lift); padding:14px 22px; border-radius:18px; box-shadow:0 6px 22px rgba(31,46,70,.05); border:1px solid var(--line); margin-bottom:44px; }
    .audio-btn { width:46px; height:46px; background:var(--navy); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .2s,background .2s; flex-shrink:0; }
    .audio-btn:hover { transform:scale(1.05); background:var(--coral-ink); }
    .audio-btn svg { fill:var(--void); width:16px; height:16px; }
    .audio-info { flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
    .audio-meta { display:flex; justify-content:space-between; align-items:center; font-size:.72rem; font-weight:600; color:var(--navy); }
    .audio-meta .a-k { display:flex; align-items:center; gap:7px; letter-spacing:.02em; }
    .audio-time { font-family:var(--mono); font-size:.68rem; color:var(--text-ghost); }
    .audio-track { width:100%; height:4px; background:rgba(31,46,70,.08); border-radius:3px; position:relative; cursor:pointer; }
    .audio-progress { position:absolute; left:0; top:0; height:100%; width:0%; background:var(--coral-ink); border-radius:3px; }

    .lesson-body { font-size:1.12rem; line-height:1.85; color:var(--text-dim); margin-bottom:48px; max-width:66ch; }
    .lesson-body p { margin-bottom:1.5em; }
    .lesson-body strong { color:var(--navy); font-weight:600; }
    .lesson-body blockquote { font-family:var(--serif); font-size:1.55rem; font-weight:500; font-style:italic; line-height:1.4; color:var(--coral-ink); border-left:3px solid var(--coral); padding:4px 0 4px 26px; margin:36px 0; }

    .teach-list { list-style:none; counter-reset:t; display:flex; flex-direction:column; gap:12px; margin:6px 0 4px; }
    .teach-list li { counter-increment:t; position:relative; padding:16px 20px 16px 58px; background:var(--void-lift); border:1px solid var(--line); border-radius:14px; font-size:1rem; line-height:1.55; color:var(--text-dim); transition:transform .3s var(--ease),box-shadow .3s; }
    .teach-list li:hover { transform:translateX(4px); box-shadow:0 10px 26px rgba(31,46,70,.06); }
    .teach-list li::before { content:counter(t,decimal-leading-zero); position:absolute; left:18px; top:16px; font-family:var(--serif); font-size:1.25rem; font-weight:600; color:var(--coral-ink); }
    .teach-list li strong { color:var(--navy); font-weight:600; }

    .infographic { width:100%; background:var(--void-lift); border:1px solid var(--line); border-radius:22px; padding:44px; margin:4px 0 48px; display:flex; flex-direction:column; align-items:center; gap:18px; box-shadow:0 12px 34px rgba(31,46,70,.04); }
    .infographic svg { max-width:100%; height:auto; }
    .info-cap { font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-ghost); }

    .reflect { background:var(--navy); border-radius:22px; padding:36px 40px; margin-bottom:48px; position:relative; overflow:hidden; }
    .reflect::after { content:'\201C'; position:absolute; right:18px; top:-28px; font-family:var(--serif); font-size:9rem; color:rgba(244,168,138,.12); line-height:1; }
    .reflect-k { font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--coral); margin-bottom:14px; display:flex; align-items:center; gap:9px; }
    .reflect-q { font-family:var(--serif); font-size:1.5rem; font-weight:400; font-style:italic; line-height:1.45; color:var(--void); max-width:54ch; position:relative; z-index:1; }

    .resources-box { background:var(--void-lift); border:1px solid var(--line); border-radius:22px; padding:34px 36px; box-shadow:0 8px 30px rgba(31,46,70,.03); }
    .resources-title { font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--navy); margin-bottom:20px; display:flex; align-items:center; gap:10px; }
    .resource-item { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px; background:var(--void); border:1px solid var(--line); border-radius:14px; text-decoration:none; transition:all .3s var(--ease); margin-bottom:10px; }
    .resource-item:last-child { margin-bottom:0; }
    .resource-item:hover { border-color:rgba(133,153,173,.35); background:#fff; box-shadow:0 10px 28px rgba(31,46,70,.07); transform:translateY(-2px); }
    .res-info { display:flex; align-items:center; gap:16px; min-width:0; }
    .res-icon { width:42px; height:42px; border-radius:11px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
    .res-name { font-weight:600; font-size:.98rem; color:var(--navy); margin-bottom:3px; }
    .res-meta { font-family:var(--mono); font-size:.66rem; color:var(--text-ghost); }
    .res-download { font-family:var(--mono); font-size:.64rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-ink); white-space:nowrap; transition:color .2s; }
    .resource-item:hover .res-download { color:var(--coral-ink); }
    .res-empty { padding:22px; text-align:center; font-size:.9rem; color:var(--text-ghost); font-style:italic; font-family:var(--serif); border:1px dashed var(--line); border-radius:14px; }

    .lesson-nav { display:flex; align-items:stretch; gap:14px; margin-top:52px; }
    .nav-btn { flex:1; display:flex; align-items:center; gap:12px; padding:18px 22px; background:var(--void-lift); border:1px solid var(--line); border-radius:16px; text-decoration:none; transition:all .3s var(--ease); cursor:pointer; }
    .nav-btn:hover:not(.disabled) { border-color:rgba(133,153,173,.35); box-shadow:0 10px 26px rgba(31,46,70,.06); transform:translateY(-2px); }
    .nav-btn.disabled { opacity:.4; pointer-events:none; }
    .nav-btn.next { justify-content:flex-end; text-align:right; }
    .nav-btn .nb-k { font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-ghost); }
    .nav-btn .nb-t { font-family:var(--serif); font-size:1.05rem; font-weight:500; color:var(--navy); }
    .nav-btn .nb-arrow { font-size:1.3rem; color:var(--coral-ink); flex-shrink:0; }

    .complete-btn { width:100%; margin-top:14px; padding:17px; border:none; border-radius:16px; background:var(--navy); color:var(--void); font-family:var(--sans); font-size:.82rem; font-weight:600; letter-spacing:.04em; cursor:pointer; transition:all .3s var(--ease); display:flex; align-items:center; justify-content:center; gap:10px; }
    .complete-btn:hover { background:var(--coral-ink); transform:translateY(-2px); box-shadow:0 14px 32px rgba(217,107,71,.25); }
    .complete-btn.done { background:var(--gold-soft); color:var(--gold); border:1px solid rgba(176,141,87,.3); cursor:default; transform:none; box-shadow:none; }
    .complete-btn svg { width:16px; height:16px; }

    /* LOCK */
    #lock { position:fixed; inset:0; z-index:9999; background:var(--navy); display:flex; align-items:center; justify-content:center; transition:opacity .6s ease; }
    #lock .box { text-align:center; max-width:420px; padding:48px 32px; width:90%; }
    #lock .seal { width:46px; height:46px; margin:0 auto 22px; }
    #lock .seal svg { width:100%; height:100%; animation:sealin 1s var(--ease); }
    @keyframes sealin { from{opacity:0;transform:scale(.7) rotate(-20deg);} to{opacity:1;transform:none;} }
    #lock h1 { font-family:var(--serif); font-size:clamp(2rem,5vw,2.9rem); font-weight:300; color:var(--void); line-height:1.1; margin-bottom:8px; }
    #lock h1 em { font-style:italic; color:var(--gold); }
    #lock .sub { font-size:.82rem; color:rgba(250,246,242,.45); margin-bottom:38px; letter-spacing:.04em; }
    #lock form { display:flex; flex-direction:column; gap:12px; }
    #lock input { width:100%; padding:15px 20px; background:rgba(250,246,242,.06); border:1px solid rgba(250,246,242,.14); border-radius:12px; color:var(--void); font-family:var(--mono); font-size:1rem; text-align:center; letter-spacing:.22em; outline:none; transition:border-color .2s; }
    #lock input:focus { border-color:var(--coral); }
    #lock button { width:100%; padding:15px 20px; background:var(--coral-ink); color:#fff; border:none; border-radius:12px; font-family:var(--sans); font-size:.82rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; transition:opacity .2s,transform .2s; }
    #lock button:hover { opacity:.9; transform:translateY(-1px); }
    #le { margin-top:14px; font-size:.8rem; color:var(--coral); opacity:0; transition:opacity .3s; min-height:1em; }
    #lockLangs { margin-top:30px; display:flex; gap:8px; justify-content:center; }
    #lockLangs button { width:auto; padding:6px 14px; background:transparent; border:1px solid rgba(250,246,242,.16); color:rgba(250,246,242,.55); font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; border-radius:999px; text-transform:none; }
    #lockLangs button.active { background:rgba(250,246,242,.1); color:var(--void); border-color:rgba(250,246,242,.3); }

        '<line x1="150" y1="20" x2="150" y2="280" stroke="rgba(31,46,70,.1)" stroke-width="1.5"/><line x1="20" y1="150" x2="280" y2="150" stroke="rgba(31,46,70,.1)" stroke-width="1.5"/>'+
        '<rect x="34" y="34" width="98" height="98" rx="14" fill="rgba(217,107,71,.08)" stroke="#D96B47" stroke-width="1.3"/><text x="83" y="78" text-anchor="middle" font-weight="700" font-size="12" fill="#D96B47" letter-spacing="1">'+lb.f1+'</text><text x="83" y="100" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#1F2E46">'+lb.f1s+'</text>'+
        '<rect x="168" y="34" width="98" height="98" rx="14" fill="rgba(133,153,173,.1)" stroke="#8599AD" stroke-width="1.3"/><text x="217" y="78" text-anchor="middle" font-weight="700" font-size="12" fill="#5E7488" letter-spacing="1">'+lb.f2+'</text><text x="217" y="100" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#1F2E46">'+lb.f2s+'</text>'+
        '<rect x="34" y="168" width="98" height="98" rx="14" fill="rgba(31,46,70,.05)" stroke="#1F2E46" stroke-width="1.3"/><text x="83" y="208" text-anchor="middle" font-weight="700" font-size="10.5" fill="#1F2E46" letter-spacing=".5">'+lb.f3+'</text><text x="83" y="230" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#1F2E46">'+lb.f3s+'</text>'+
        '<rect x="168" y="168" width="98" height="98" rx="14" fill="rgba(244,168,138,.18)" stroke="#F4A88A" stroke-width="1.3"/><text x="217" y="208" text-anchor="middle" font-weight="700" font-size="10.5" fill="#D96B47" letter-spacing=".5">'+lb.f4+'</text><text x="217" y="230" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#1F2E46">'+lb.f4s+'</text>'+
        '<circle cx="150" cy="150" r="26" fill="#1F2E46"/><text x="150" y="155" text-anchor="middle" font-weight="700" font-size="11" fill="#FAF6F2" letter-spacing="1">'+lb.you+'</text>'+
        '</g></svg>';
      if (id===3) return '<svg width="440" height="170" viewBox="0 0 440 170" role="img"><g font-family="DM Sans, sans-serif">'+
        '<circle cx="70" cy="80" r="42" fill="none" stroke="#1F2E46" stroke-width="1.5" stroke-dasharray="9 6"/><text x="70" y="85" text-anchor="middle" font-weight="700" font-size="12" fill="#1F2E46" letter-spacing="1">'+lb.a+'</text><text x="70" y="150" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="17" fill="#1F2E46">'+lb.as+'</text>'+
        '<line x1="124" y1="80" x2="316" y2="80" stroke="#D96B47" stroke-width="2" stroke-dasharray="7 7"/><path d="M210 66l20 28M230 66l-20 28" stroke="#D96B47" stroke-width="2.4" stroke-linecap="round"/><text x="220" y="44" text-anchor="middle" font-weight="700" font-size="10.5" fill="#D96B47" letter-spacing="1">'+lb.mid+'</text>'+
        '<circle cx="370" cy="80" r="42" fill="rgba(244,168,138,.18)" stroke="#F4A88A" stroke-width="1.5"/><text x="370" y="85" text-anchor="middle" font-weight="700" font-size="12" fill="#D96B47" letter-spacing="1">'+lb.b+'</text><text x="370" y="150" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="17" fill="#1F2E46">'+lb.bs+'</text>'+
        '</g></svg>';
      if (id===4) return '<svg width="340" height="170" viewBox="0 0 340 170" role="img"><g font-family="DM Sans, sans-serif">'+
        '<line x1="60" y1="42" x2="150" y2="80" stroke="#8599AD" stroke-width="1.3"/><line x1="60" y1="128" x2="150" y2="90" stroke="#8599AD" stroke-width="1.3"/><line x1="40" y1="85" x2="128" y2="85" stroke="#8599AD" stroke-width="1.3"/>'+
        '<circle cx="40" cy="42" r="6" fill="#D96B47"/><circle cx="30" cy="85" r="6" fill="#F4A88A"/><circle cx="40" cy="128" r="6" fill="#8599AD"/>'+
        '<circle cx="170" cy="85" r="46" fill="#1F2E46"/><path d="M152 84c4 6 32 6 36 0" fill="none" stroke="#F4A88A" stroke-width="3.5" stroke-linecap="round"/><circle cx="156" cy="74" r="3.5" fill="#F4A88A"/><circle cx="184" cy="74" r="3.5" fill="#F4A88A"/>'+
        '<text x="170" y="156" text-anchor="middle" font-weight="700" font-size="11" fill="#1F2E46" letter-spacing="1">'+lb.core+'</text>'+
        '</g></svg>';
      return '';
    }

    /* ════════ RENDER: chrome ════════ */
    function renderChrome(){
      document.documentElement.lang = lang;
      document.getElementById('lockTitle').innerHTML = tt('lockTitle');
      document.getElementById('lockSub').textContent = tt('lockSub');
      document.getElementById('lp').setAttribute('placeholder', tt('placeholder'));
      document.getElementById('lockBtn').textContent = tt('enter');
      document.getElementById('userSince').textContent = tt('userSince');
      document.getElementById('badgeLabel').textContent = tt('badge');
      document.getElementById('logout').textContent = tt('logout');
      document.getElementById('vClose').textContent = tt('close');
      document.getElementById('vpK').textContent = tt('vK');
      document.getElementById('vpT').textContent = tt('vT');
      // language toggles
      var lt = document.getElementById('lang');
      lt.classList.toggle('en', lang==='en');
      lt.querySelector('[data-l="es"]').classList.toggle('active', lang==='es');
      lt.querySelector('[data-l="en"]').classList.toggle('active', lang==='en');
      document.querySelectorAll('#lockLangs button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-l')===lang); });
    }

    /* ════════ RENDER: rail ════════ */
    function renderRail(){
      var rail = document.getElementById('rail'); rail.innerHTML = '';
      CHAPTERS.forEach(function(ch){
        var g = document.createElement('div'); g.className = 'mod-group';
        g.innerHTML = '<div class="mod-chapter"><span class="ch-n">'+(lang==='es'?'Cap.':'Ch.')+' '+ch.n+'</span><span class="ch-name">'+ch.name[lang]+'</span>'+(ch.locked?'<span class="ch-lock">'+LOCKICO+'</span>':'')+'</div>';
        ch.lessons.forEach(function(lid){
          var L = LESSONS[lid]; var locked = !!L.locked;
          var item = document.createElement('div');
          item.className = 'mod-item'+(locked?' locked':'')+(lid===current&&!locked?' active':'');
          item.id = 'rail-'+lid;
          if (!locked) item.onclick = (function(x){ return function(){ switchLesson(x); }; })(lid);
          var status = locked ? '<span class="mod-status">'+LOCKICO+'</span>'
            : '<span class="mod-status'+(isDone(lid)?' done':'')+'">'+(isDone(lid)?CHECK:L.num)+'</span>';
          item.innerHTML = status+'<span class="mod-body"><span class="mod-title">'+L[lang].title+'</span>'+
            (locked?'<span class="mod-dur">'+tt('soon')+'</span>':'<span class="mod-dur">'+L.dur+'</span>')+'</span>';
          g.appendChild(item);
        });
        rail.appendChild(g);
      });
      var soon = document.createElement('div'); soon.className='chapter-soon'; soon.innerHTML = tt('chapterSoon');
      rail.appendChild(soon);
    }

    /* ════════ RENDER: progress ════════ */
    function renderProgress(){
      var done = progress.completed.filter(function(id){ return AVAILABLE.indexOf(id)!==-1; }).length;
      var total = AVAILABLE.length, circ = 2*Math.PI*25;
      var ring = document.getElementById('ring');
      ring.setAttribute('stroke-dasharray', circ.toFixed(1));
      ring.setAttribute('stroke-dashoffset', (circ*(1-done/total)).toFixed(1));
      document.getElementById('ringPct').textContent = Math.round(done/total*100)+'%';
      document.getElementById('courseSub').innerHTML = '<b>'+done+'</b> '+tt('of')+' '+total+' '+tt('modules')+' · '+tt('courseTime');
    }

    /* ════════ RENDER: lesson ════════ */
    function renderLesson(id, keepScroll){
      var L = LESSONS[id], c = L[lang];
      var scroll = document.getElementById('scroll');
      var st = keepScroll ? scroll.scrollTop : 0;
      var h = '';
      h += '<div class="lesson-eyebrow"><span>'+tt('module')+' '+L.num+'</span><span class="dot"></span><span>'+tt('chapter')+' '+L.chapterNum+'</span><span class="dot"></span><span>'+L.dur+'</span></div>';
      h += '<h1 class="lesson-title">'+c.h1+'</h1>';
      if (L.hasVideo) h += '<div class="video-shell" onclick="openVideo()" style="background-image:url(\''+L.poster+'\');"><div class="play-video-btn">'+PLAY+'</div><div class="video-label"><div class="vl-k">'+tt('videoClass')+'</div><div class="vl-t">'+c.videoLabel+'</div></div></div>';
      h += '<div class="audio-player"><div class="audio-btn" onclick="toggleAudio(this)">'+PLAY+'</div><div class="audio-info"><div class="audio-meta"><span class="a-k">'+tt('listen')+'</span><span class="audio-time">'+L.dur+'</span></div><div class="audio-track"><div class="audio-progress" id="prog"></div></div></div></div>';
      h += '<div class="lesson-body">';
      c.body.forEach(function(b){
        if (b.p) h += '<p>'+b.p+'</p>';
        else if (b.quote) h += '<blockquote>'+b.quote+'</blockquote>';
        else if (b.list){ h += '<ul class="teach-list">'; b.list.forEach(function(li){ h += '<li>'+li+'</li>'; }); h += '</ul>'; }
      });
      h += '</div>';
      h += '<div class="infographic">'+infoSVG(id, c.info.labels)+'<span class="info-cap">'+c.info.caption+'</span></div>';
      h += '<div class="reflect"><div class="reflect-k"><span>\u2726</span> '+tt('reflect')+'</div><div class="reflect-q">'+c.reflect+'</div></div>';
      h += '<div class="resources-box"><h3 class="resources-title">'+FILEHEAD+' '+tt('materials')+'</h3>';
      if (c.resources && c.resources.length){
        c.resources.forEach(function(r){
          var attrs = r.download ? (' target="_blank" download="'+r.download+'"') : '';
          h += '<a href="'+r.href+'"'+attrs+' class="resource-item"><div class="res-info"><span class="res-icon">'+FILEICO+'</span><div><div class="res-name">'+r.name+'</div><div class="res-meta">'+r.meta+'</div></div></div><span class="res-download">'+tt('download')+'</span></a>';
        });
      } else { h += '<div class="res-empty">'+tt('resEmpty')+'</div>'; }
      h += '</div>';
      h += '<div class="lesson-nav" id="lessonNav"></div>';
      h += '<button class="complete-btn" id="completeBtn"></button>';

      var host = document.getElementById('lessonHost');
      host.innerHTML = h;

      // topbar
      var chName = CHAPTERS[ Number(L.chapterNum)-1 ].name[lang];
      document.getElementById('tbChapter').textContent = tt('chapter')+' '+(Number(L.chapterNum)<10?'0':'')+L.chapterNum+' · '+chName;
      document.getElementById('tbTitle').textContent = c.title;
      document.getElementById('tbCount').textContent = tt('moduleCount').replace('{a}', AVAILABLE.indexOf(id)+1).replace('{b}', AVAILABLE.length);

      renderNav(id);
      renderComplete(id);
      scroll.scrollTop = st;
      document.getElementById('tbRead').style.width = (function(){ var hh=scroll.scrollHeight-scroll.clientHeight; return (hh>0?(st/hh)*100:0)+'%'; })();
    }

    function renderNav(id){
      var idx = AVAILABLE.indexOf(id), prev = AVAILABLE[idx-1], next = AVAILABLE[idx+1], html='';
      if (prev) html += '<a class="nav-btn prev" onclick="switchLesson('+prev+')"><span class="nb-arrow">←</span><span><span class="nb-k">'+tt('prev')+'</span><br><span class="nb-t">'+LESSONS[prev][lang].title+'</span></span></a>';
      else html += '<span class="nav-btn prev disabled"><span class="nb-arrow">←</span><span><span class="nb-k">'+tt('courseStart')+'</span></span></span>';
      if (next) html += '<a class="nav-btn next" onclick="switchLesson('+next+')"><span><span class="nb-k">'+tt('next')+'</span><br><span class="nb-t">'+LESSONS[next][lang].title+'</span></span><span class="nb-arrow">→</span></a>';
      else html += '<span class="nav-btn next disabled"><span><span class="nb-k">'+tt('courseEnd')+'</span></span><span class="nb-arrow">\u2726</span></span>';
      document.getElementById('lessonNav').innerHTML = html;
    }

    function renderComplete(id){
      var cb = document.getElementById('completeBtn');
      if (isDone(id)){ cb.className='complete-btn done'; cb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> '+tt('completed'); cb.onclick=null; }
      else { cb.className='complete-btn'; cb.textContent=tt('markComplete'); cb.onclick=function(){ markComplete(id); }; }
    }

    /* ════════ ACTIONS ════════ */
    function switchLesson(id){
      if (LESSONS[id] && LESSONS[id].locked) return;
      current = id; progress.last = id; saveProgress();
      document.querySelectorAll('.mod-item').forEach(function(el){ el.classList.remove('active'); });
      var ri = document.getElementById('rail-'+id); if (ri) ri.classList.add('active');
      renderLesson(id, false);
      if (window.innerWidth <= 900) closeDrawer();
    }

    function markComplete(id){
      if (isDone(id)) return;
      progress.completed.push(id); saveProgress();
      var rs = document.querySelector('#rail-'+id+' .mod-status'); if (rs){ rs.classList.add('done'); rs.innerHTML = CHECK; }
      renderProgress(); renderComplete(id);
      var done = progress.completed.filter(function(x){ return AVAILABLE.indexOf(x)!==-1; }).length;
      showToast(done===AVAILABLE.length ? tt('allDone') : tt('completed'));
      var next = AVAILABLE[AVAILABLE.indexOf(id)+1];
      if (next) setTimeout(function(){ switchLesson(next); }, 900);
    }

    function setLang(l){
      l = (l==='en') ? 'en' : 'es';
      if (l === lang) return;
      lang = l;
      try { localStorage.setItem('lg_parent_lang', lang); } catch(e){}
      renderChrome(); renderRail(); renderProgress(); renderLesson(current, true);
      if (document.getElementById('le').style.opacity === '1') document.getElementById('le').textContent = tt('wrong');
    }

    var toastT;
    function showToast(msg){ var t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, 2800); }

    document.getElementById('scroll').addEventListener('scroll', function(){ var hh=this.scrollHeight-this.clientHeight; document.getElementById('tbRead').style.width=(hh>0?(this.scrollTop/hh)*100:0)+'%'; }, {passive:true});

    function toggleDrawer(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('scrim').classList.toggle('on'); }
    function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }

    function openVideo(){ document.getElementById('vmodal').classList.add('on'); }
    function closeVideo(){ document.getElementById('vmodal').classList.remove('on'); }
    document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeVideo(); });

    function toggleAudio(btn){
      var prog = document.getElementById('prog');
      if (btn.innerHTML.indexOf('rect') !== -1){ btn.innerHTML=PLAY; prog.style.transition='none'; prog.style.width='0%'; }
      else { btn.innerHTML=PAUSE; prog.style.transition = reduce?'none':'width 30s linear'; requestAnimationFrame(function(){ prog.style.width = reduce?'40%':'100%'; }); }
    }

    /* ════════ LOCK ════════ */
    (function(){ if (sessionStorage.getItem('csc_portal_access')==='granted') document.getElementById('lock').style.display='none'; })();
    function checkPass(e){
      e.preventDefault();
      if (document.getElementById('lp').value === 'NARI2026'){
        sessionStorage.setItem('csc_portal_access','granted');
        var lock=document.getElementById('lock'); lock.style.opacity='0';
        setTimeout(function(){ lock.style.display='none'; }, 600);
      } else {
        var err=document.getElementById('le'); err.textContent=tt('wrong'); err.style.opacity='1';
        document.getElementById('lp').value='';
        setTimeout(function(){ err.style.opacity='0'; }, 3000);
      }
    }
    // TODO: Integrar con Firebase Auth o Memberstack (acceso por niveles) y leer el idioma del perfil del miembro.

    /* ════════ WIRE TOGGLES ════════ */
    document.getElementById('lang').addEventListener('click', function(e){ var b=e.target.closest('[data-l]'); if (b) setLang(b.getAttribute('data-l')); });
    document.getElementById('lockLangs').addEventListener('click', function(e){ var b=e.target.closest('[data-l]'); if (b) setLang(b.getAttribute('data-l')); });

    /* ════════ INIT ════════ */
    renderChrome();
    renderRail();
    renderProgress();
    var startId = (progress.last && LESSONS[progress.last] && !LESSONS[progress.last].locked) ? progress.last : 1;
    current = startId;
    var ri0 = document.getElementById('rail-'+startId); if (ri0) ri0.classList.add('active');
    renderLesson(startId, false);
  </script>
</body>
</html>
