  <style>
    :root {
      --void:        #0e0b12;
      --void-mid:    #13101a;
      --void-lift:   #1a1624;
      --text:        #F2EEE9;
      --text-dim:    rgba(242,238,233,.62);
      --text-ghost:  rgba(242,238,233,.34);
      --gold:        #C9A96E;

      --serif:  'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
      --sans:   'DM Sans', system-ui, sans-serif;

      --ease-silk:   cubic-bezier(0.16, 1, 0.3, 1);
      --pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--sans);
      background: var(--void);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--gold); }

    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 70% 10%, rgba(201,169,110,.06) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 90%, rgba(201,169,110,.035) 0%, transparent 60%);
    }

    .grain {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none; opacity: .022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 192px;
    }

    main {
      position: relative; z-index: 2;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(88px, 12vh) 22px 56px;
    }

    .hero {
      width: 100%;
      max-width: 980px;
      padding: 56px 52px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute; inset: -30%;
      background: radial-gradient(circle at 40% 30%, rgba(201,169,110,.10), transparent 55%);
      pointer-events: none;
      opacity: .7;
    }

    .hero > * { position: relative; z-index: 1; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-ghost);
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: '';
      width: 28px;
      height: 1px;
      background: rgba(201,169,110,.7);
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.4rem, 4.8vw, 4.1rem);
      letter-spacing: .01em;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .subcopy {
      font-size: 1.02rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 10px;
      max-width: 62ch;
    }

    .paragraph {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(242,238,233,.70);
      line-height: 1.65;
      max-width: 62ch;
      margin-bottom: 26px;
    }

    .waitlist-row {
      display: flex;
      gap: 10px;
      max-width: 520px;
      width: 100%;
      margin-top: 6px;
    }

    .waitlist-row input {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text);
      font-family: var(--sans);
      font-size: .92rem;
      outline: none;
      transition: border-color .3s var(--ease-silk);
    }

    .waitlist-row input:focus { border-color: rgba(201,169,110,.55); }
    .waitlist-row input::placeholder { color: var(--text-ghost); }

    .waitlist-row button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-family: var(--sans);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      background: rgba(201,169,110,.92);
      color: #0e0b12;
      box-shadow: 0 10px 34px rgba(0,0,0,.28);
      transition: transform .35s var(--ease-silk), box-shadow .35s var(--ease-silk), background .35s var(--ease-silk);
      flex-shrink: 0;
    }

    .waitlist-row button:hover {
      transform: translateY(-1px);
      background: rgba(201,169,110,1);
      box-shadow: 0 14px 42px rgba(0,0,0,.38);
    }

    #waitlist-success {
      display: none;
      text-align: left;
      font-family: var(--serif);
      font-style: italic;
      color: rgba(201,169,110,.95);
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 62ch;
      margin-top: 6px;
    }

    @media (max-width: 740px) {
      .hero { padding: 42px 26px; }
      .waitlist-row { flex-direction: column; max-width: none; }
      .waitlist-row button { width: 100%; padding: 16px 22px; }
    }
  </style>

<body data-protocol="general">
  <div class="grain" aria-hidden="true"></div>

  <main>
    <section class="hero" aria-label="Aprender">
      <div class="eyebrow" data-i18n="hero_eyebrow" data-es="CRIAR SIN CULPAS · APRENDER" data-en="CRIAR SIN CULPAS · LEARN">CRIAR SIN CULPAS · APRENDER</div>
      <h1 data-i18n="hero_headline" data-es="Los Primeros 5 Minutos." data-en="The First 5 Minutes.">Los Primeros 5 Minutos.</h1>
      <p class="subcopy" data-i18n="hero_subcopy" data-es="Una guía de respuesta rápida para bajar la intensidad antes del desborde. Diseñado para momentos de agobio." data-en="A calm-response guide for lowering intensity before escalation. Designed for overwhelmed moments.">Una guía de respuesta rápida para bajar la intensidad antes del desborde. Diseñado para momentos de agobio.</p>

      <form class="waitlist-row" id="waitlist-form">
        <input type="email" data-i18n-placeholder="waitlist_placeholder" placeholder="Tu correo electrónico" required aria-label="Tu correo electrónico">
        <button type="submit" data-i18n="hero_cta" data-es="Avísame cuando esté disponible" data-en="Notify me when available">Avísame cuando esté disponible</button>
      </form>

      <div id="waitlist-success" data-i18n="waitlist_success" data-es="Gracias. Te avisaremos cuando esté disponible." data-en="Thank you. We’ll notify you when it’s available.">Gracias. Te avisaremos cuando esté disponible.</div>
    </section>
  </main>

  <script>
  (function () {
    const STORAGE_KEY = 'lg_parent_lang';
    let lang = localStorage.getItem(STORAGE_KEY) || 'es';

    window.addEventListener('pageshow', (e) => { if (e.persisted) document.body.style.opacity = '1'; });

    function applyLang(l) {
      lang = l;
      localStorage.setItem(STORAGE_KEY, l);
      document.documentElement.lang = l;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const txt = el.getAttribute('data-' + l);
        if (txt) el.innerHTML = txt;
      });
      document.querySelectorAll('[data-i18n-meta]').forEach(el => {
        const txt = el.getAttribute('data-' + l);
        if (txt) el.setAttribute('content', txt);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const map = {
          waitlist_placeholder: { es: 'Tu correo electrónico', en: 'Your email address' }
        };
        if (map[key]) {
          el.placeholder = map[key][l];
          el.setAttribute('aria-label', map[key][l]);
        }
      });
    }

    applyLang(lang);

    const waitlistForm = document.getElementById('waitlist-form');
    const waitlistSuccess = document.getElementById('waitlist-success');
    if (!waitlistForm || !waitlistSuccess) return;

    waitlistForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (waitlistForm.dataset.submitted === '1') return;
      waitlistForm.dataset.submitted = '1';

      waitlistForm.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      waitlistForm.style.opacity = '0';
      waitlistForm.style.transform = 'translateY(8px)';

      setTimeout(() => {
        waitlistForm.style.display = 'none';
        waitlistSuccess.style.display = 'block';
        waitlistSuccess.style.opacity = '0';
        waitlistSuccess.style.transform = 'translateY(8px)';
        waitlistSuccess.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        requestAnimationFrame(() => {
          waitlistSuccess.style.opacity = '1';
          waitlistSuccess.style.transform = 'translateY(0)';
        });
      }, 420);

      if (window.track) window.track('waitlist_joined', { location: 'aprende_hero', language: lang });
    });
  })();
  </script>
</body>
