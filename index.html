<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0b12">
  <title>Criar Sin Culpas</title>
  <meta name="description" content="Orientación práctica y emocional para la crianza consciente. Sin culpas.">
  <meta property="og:title" content="Criar Sin Culpas">
  <meta property="og:description" content="Orientación práctica y emocional para la crianza consciente. Sin culpas.">
  <meta property="og:url" content="https://criarsinculpas.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/favicon/CSC_favicon.png">
  <!-- Privacy-friendly analytics by Plausible --> 
  <script async src="https://plausible.io/js/pa-aBQa31dOYQ7rF5Dn1DVy9.js"></script> 
  <script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script> 
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    a, button { font: inherit; text-decoration: none; border: none; background: none; color: inherit; cursor: pointer; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #f7f1ec;
      background: #0e0b12;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* Atmospheric orbs */
    .orbs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(97,209,196,.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 90% 80%, rgba(255,125,115,.18) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 50%, rgba(141,121,255,.08) 0%, transparent 65%),
        linear-gradient(160deg, #130e1a 0%, #0b0810 50%, #100c15 100%);
    }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .content {
      position: relative; z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
    }

    /* Wordmark */
    .wordmark {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -.02em;
      color: #f7f1ec;
      margin-bottom: 16px;
      font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    }

    .tagline {
      font-size: clamp(.88rem, 3vw, 1rem);
      color: rgba(255,255,255,.45);
      line-height: 1.65;
      max-width: 32ch;
      margin-bottom: 48px;
    }

    /* CTA to hub */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      font-size: .9rem;
      font-weight: 700;
      color: #fff;
      transition: background 220ms, transform 220ms;
      margin-bottom: 16px;
    }
    .cta:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
    .cta:active { transform: scale(.97); }
    .cta-arrow { font-size: 1rem; opacity: .6; }

    .cta-note {
      font-size: .75rem;
      color: rgba(255,255,255,.25);
      font-weight: 600;
      letter-spacing: .04em;
    }

    /* Decorative dots */
    .dots {
      display: flex;
      gap: 8px;
      margin-bottom: 40px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      opacity: .35;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .wordmark { animation: fadeInUp .7s cubic-bezier(.22,1,.36,1) .1s both; }
    .tagline  { animation: fadeInUp .7s cubic-bezier(.22,1,.36,1) .2s both; }
    .dots     { animation: fadeInUp .7s cubic-bezier(.22,1,.36,1) .28s both; }
    .cta      { animation: fadeInUp .7s cubic-bezier(.22,1,.36,1) .35s both; }
    .cta-note { animation: fadeInUp .7s cubic-bezier(.22,1,.36,1) .42s both; }

    @media(prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; }
    }

    .watermark { 
      position: fixed; 
      bottom: -60px; 
      right: -40px; 
      width: 420px; 
      height: 420px; 
      pointer-events: none; 
      z-index: 1; 
      opacity: .22; 
      filter: grayscale(100%) brightness(1.1); 
      mix-blend-mode: normal; 
    } 
    .watermark img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      object-position: bottom right; 
    } 
    @media(max-width:600px) { 
      .watermark { width: 280px; height: 280px; bottom: -40px; right: -30px; opacity: .15; } 
    } 
  </style>
</head>
<body>
  <div class="watermark" aria-hidden="true"> 
    <img src="/assets/images/CSC_Logo_Grayscale.png" alt=""> 
  </div> 
  <div class="orbs"></div>
  <div class="grain"></div>

  <div class="content">
    <h1 class="wordmark">Criar Sin Culpas</h1>
    <p class="tagline">Orientación práctica y emocional para navegar los momentos difíciles de la crianza. Sin culpas.</p>

    <div class="dots">
      <div class="dot" style="background:#8d79ff"></div>
      <div class="dot" style="background:#ff7d73"></div>
      <div class="dot" style="background:#61d1c4"></div>
      <div class="dot" style="background:#d17ee9"></div>
    </div>

    <a href="/apoyo" class="cta">
      Ver guías de apoyo <span class="cta-arrow">→</span>
    </a>
    <p class="cta-note">Acceso inmediato · Sin registro</p>
  </div>
</body>
</html>
